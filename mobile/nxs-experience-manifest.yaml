    - "en"
  rtl_ready: true
  pseudolocalization: "required"
accessibility:
  large_text: "required"
  screen_reader: "required"
  reduced_motion: "required"
  high_contrast: "required"
visual:
  surface_style: "calm"
  expressive_energy_layer: "disabled"
performance:
  profile: "balanced"
certification:
  level: "strict"
  hard_block_accessibility: true
scope:
  programme: "TENGASELL-MOBILE-01"
  work_unit: "MOB-01-R1"
  note: "NXS governs the native presentation and interaction layer only; canonical product, auth, security, data and commercial authority remain unchanged."
