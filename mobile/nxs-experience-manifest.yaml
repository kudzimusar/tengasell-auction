nxs:
  version: "1.0"
  release: "Pilot Release"
  authority: "11-11 Tech NXS Framework 1.0"
product:
  name: "TengaSell"
  type: "marketplace"
  personality:
    - "premium"
    - "calm"
    - "confident"
platforms:
  ios: true
  android: true
implementation:
  primary: "react-native-expo"
experience:
  density: "comfortable"
  motion: "restrained"
  haptics: "off"
  voice: "off"
navigation:
  model: "adaptive"
  compact: "stack"
  expanded: "stack"
internationalization:
  default: "en"
