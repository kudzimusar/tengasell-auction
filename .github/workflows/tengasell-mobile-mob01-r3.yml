name: Tengasell Mobile MOB-01 R3 logout-continuity gates

on:
  push:
    branches:
      - fix/tengasell-mobile-mob01-r3-logout-continuity
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mob01-r3-session-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact R3 candidate
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked dependencies
        working-directory: mobile
        run: npm ci
      - name: R3 deterministic fault regression
        working-directory: mobile
        run: node --experimental-strip-types --test tests/logout-continuity.test.mjs
      - name: NXS foundation enforcement
        working-directory: mobile
        run: node scripts/verify-nxs-foundation.mjs
      - name: Dependency advisory snapshot (new high/critical remain gated)
        working-directory: mobile
        run: |
          npm audit --json > /tmp/mob01-r3-npm-audit.json || true
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync("/tmp/mob01-r3-npm-audit.json", "utf8"));
            const knownHigh = new Set(["expo", "@expo/cli", "zod"]);
            let blocked = false;
            for (const [name, issue] of Object.entries(report.vulnerabilities ?? {})) {
              console.log(name, issue.severity, JSON.stringify(issue.via));
              if (issue.severity === "critical" ||
                (issue.severity === "high" && !knownHigh.has(name))) blocked = true;
            }
            if (blocked) throw new Error("Untriaged high or critical dependency advisory");
          '
      - name: Expo Doctor
        id: expo_doctor
        continue-on-error: true
        working-directory: mobile
        run: npx expo-doctor
      - name: Expo lint
        working-directory: mobile
        run: npx expo lint
      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Android export
        working-directory: mobile
        run: npx expo export --platform android
      - name: iOS export
        working-directory: mobile
        run: npx expo export --platform ios
      - name: Git diff check
        run: git diff --check
      - name: Clean working tree
        run: |
          git status --short
          test -z "$(git status --short)"
      - name: Assert Expo Doctor result after all gates
        if: always()
        run: |
          echo "Expo Doctor outcome: ${{ steps.expo_doctor.outcome }}"
          test "${{ steps.expo_doctor.outcome }}" = "success"
