name: Tengasell Mobile MOB-01 dependency convergence

on:
  push:
    branches:
      - feat/tengasell-mobile-01-product-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-sdk-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install current mobile workspace
        working-directory: mobile
        run: npm ci

      - name: Resolve Expo SDK-compatible runtime dependencies
        working-directory: mobile
        run: >-
          npx expo install
          expo-router
          react-native-safe-area-context
          react-native-screens
          expo-linking
          expo-constants
          expo-secure-store
          react-dom
          react-native-web

      - name: Resolve Expo SDK-compatible lint dependencies
        working-directory: mobile
        run: npx expo install eslint eslint-config-expo --dev

      - name: Align application package authority
        working-directory: mobile
        run: |
          npm pkg set version=0.1.0
          npm pkg set main=expo-router/entry
          npm pkg set scripts.lint="expo lint"
          npm pkg set scripts.typecheck="tsc --noEmit"
          npm install --package-lock-only --ignore-scripts

      - name: Commit Expo-resolved dependency custody
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "Package custody already converged."
          else
            git commit -m "chore(mobile): converge Expo SDK 58 dependencies [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload resolved package custody
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mob01-resolved-package-custody
          path: |
            mobile/package.json
            mobile/package-lock.json
          if-no-files-found: error
          retention-days: 7
