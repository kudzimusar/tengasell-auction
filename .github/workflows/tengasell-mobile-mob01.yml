name: Tengasell Mobile MOB-01 NXS dependency convergence

on:
  push:
    branches:
      - feat/tengasell-mobile-01-product-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-nxs-sdk-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install locked mobile workspace
        working-directory: mobile
        run: npm ci

      - name: Resolve SDK-compatible NXS theme capability
        working-directory: mobile
        run: npx expo install expo-system-ui

      - name: Commit Expo-resolved package custody
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "NXS package custody already converged."
          else
            git commit -m "chore(mobile): add Expo system theme capability [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: NXS source probe
        working-directory: mobile
        run: node scripts/verify-nxs-foundation.mjs
