name: Tengasell Mobile MOB-01 gates

on:
  push:
    branches:
      - feat/tengasell-mobile-01-product-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mob01-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install locked mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Expo doctor
        working-directory: mobile
        run: npx expo-doctor

      - name: Expo lint
        working-directory: mobile
        run: npx expo lint

      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Android export
        working-directory: mobile
        run: npx expo export --platform android

      - name: iOS export
        working-directory: mobile
        run: npx expo export --platform ios

      - name: Git diff check
        run: git diff --check

      - name: Working tree check
        run: |
          git status --short
          test -z "$(git status --short)"
