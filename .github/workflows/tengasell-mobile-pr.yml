name: Tengasell Mobile — PR gates

# CERT-04 unconditional PR gate contract:
# - Never filter out `pull_request` at workflow trigger level (otherwise a
#   required check hangs on web/docs PRs).
# - Run heavy Expo/RN checks in `mobile-gates` whenever mobile/**, docs/mobile/**,
#   or this workflow file changes (or on push / merge_group / workflow_dispatch).
# - Always execute `mobile-or-skip-gate` (`if: always()`) so branch protection
#   requiring `mobile-or-skip-gate` passes truthfully on non-mobile skips and
#   fails closed if `mobile-gates` fails, cancels, or unexpectedly skips.

on:
  pull_request:
    branches:
      - main
      - "fix/tengasell-mobile-*"
      - "feat/tengasell-mobile-*"
      - "chore/tengasell-mobile-*"
  push:
    branches:
      - "fix/tengasell-mobile-*"
      - "feat/tengasell-mobile-*"
      - "chore/tengasell-mobile-*"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect mobile scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile_changed: ${{ steps.scope.outputs.mobile_changed }}
      scope_reason: ${{ steps.scope.outputs.scope_reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate changed paths against mobile scope
        id: scope
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
            CHANGED="$(git diff --name-only "${BASE}...${HEAD}")"
            echo "Changed files in ${BASE}...${HEAD}:"
            echo "$CHANGED"

            if echo "$CHANGED" | grep -qE '^(mobile/|docs/mobile/|\.github/workflows/tengasell-mobile-pr\.yml$)'; then
              echo "mobile_changed=true" >> "$GITHUB_OUTPUT"
              echo "scope_reason=mobile-or-workflow-changed" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ ! -f mobile/package.json ]; then
              echo "mobile_changed=false" >> "$GITHUB_OUTPUT"
              echo "scope_reason=no-mobile-directory-in-base" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "mobile_changed=false" >> "$GITHUB_OUTPUT"
            echo "scope_reason=non-mobile-pr-skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "mobile_changed=true" >> "$GITHUB_OUTPUT"
          echo "scope_reason=non-pr-event-${EVENT}" >> "$GITHUB_OUTPUT"

  mobile-gates:
    name: mobile-gates
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact head and record provenance
        run: |
          set -euo pipefail
          WORKFLOW_HEAD="$(git rev-parse HEAD)"
          TESTED_MERGE="${{ github.sha }}"
          PR_SOURCE="${{ github.event.pull_request.head.sha || github.sha }}"
          PR_BASE="${{ github.event.pull_request.base.sha || '' }}"
          PR_NUMBER="${{ github.event.pull_request.number || '' }}"
          EVENT="${{ github.event_name }}"

          test "$WORKFLOW_HEAD" = "$TESTED_MERGE"

          {
            echo "### Mobile gate provenance"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| event | $EVENT |"
            echo "| pull request | ${PR_NUMBER:-n/a} |"
            echo "| PR source head | \`$PR_SOURCE\` |"
            echo "| PR base head | \`${PR_BASE:-n/a}\` |"
            echo "| tested merge SHA | \`$TESTED_MERGE\` |"
            echo "| workflow head SHA | \`$WORKFLOW_HEAD\` |"
            echo "| scope reason | \`${{ needs.detect-changes.outputs.scope_reason }}\` |"
            echo "| run | \`${{ github.run_id }}\` |"
            echo "| job attempt | \`${{ github.run_attempt }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: NXS foundation static checks
        run: node scripts/verify-nxs-foundation.mjs

      - name: Release-secret boundary (REL-002/REL-004)
        run: node scripts/verify-no-release-secrets.mjs .

      - name: Dependency security assessment
        run: |
          set -euo pipefail
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          node scripts/verify-dependency-audit.mjs "$RUNNER_TEMP/audit.json"

      - name: Expo install compatibility
        run: npx expo install --check

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Expo lint
        run: npm run lint

      - name: No unresolved merge conflict markers
        run: |
          set -euo pipefail
          if grep -rnE '^(<<<<<<<|>>>>>>>) ' src tests 2>/dev/null; then
            echo "unresolved conflict markers present" >&2
            exit 1
          fi

      - name: TypeScript
        run: npm run typecheck

      - name: Session security regressions (R3 + RACE01 + ICR02)
        run: |
          node --experimental-strip-types --test \
            tests/logout-continuity.test.mjs \
            tests/race01-stale-write.test.mjs \
            tests/storage-concurrency.test.mjs \
            tests/session-orchestrator.test.mjs \
            tests/protected-request.test.mjs \
            tests/login-barrier.test.mjs

      - name: Navigation contract (MOB-02)
        if: ${{ hashFiles('mobile/tests/navigation-contract.test.mjs') != '' }}
        run: node --experimental-strip-types --test tests/navigation-contract.test.mjs

      - name: Bidding and socket safety (MOB-03)
        if: ${{ hashFiles('mobile/tests/socket-lifecycle.test.mjs') != '' }}
        run: node --experimental-strip-types --test tests/socket-lifecycle.test.mjs

      - name: Bid acknowledgement truthfulness (CLOSE-01)
        if: ${{ hashFiles('mobile/tests/bid-acknowledgement.test.mjs') != '' }}
        run: node --experimental-strip-types --test tests/bid-acknowledgement.test.mjs

      - name: Session-safe bid completion (CLOSE-02)
        if: ${{ hashFiles('mobile/tests/bid-completion.test.mjs') != '' }}
        run: node --experimental-strip-types --test tests/bid-completion.test.mjs

      - name: Android export
        run: npx expo export --platform android

      - name: iOS export
        run: npx expo export --platform ios

      - name: Clean working tree
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --short)"

  mobile-or-skip-gate:
    name: mobile-or-skip-gate
    needs: [detect-changes, mobile-gates]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce unconditional required-check contract
        run: |
          set -euo pipefail
          DETECT_RES="${{ needs.detect-changes.result }}"
          CHANGED="${{ needs.detect-changes.outputs.mobile_changed }}"
          REASON="${{ needs.detect-changes.outputs.scope_reason }}"
          GATES_RES="${{ needs.mobile-gates.result }}"

          echo "detect-changes result: $DETECT_RES"
          echo "mobile_changed:        $CHANGED ($REASON)"
          echo "mobile-gates result:   $GATES_RES"

          if [ "$DETECT_RES" != "success" ]; then
            echo "::error::Scope detection failed or cancelled ($DETECT_RES); failing closed."
            exit 1
          fi

          if [ "$CHANGED" = "true" ]; then
            if [ "$GATES_RES" = "success" ]; then
              echo "PASS: mobile/workflow changes verified by passing mobile-gates."
              exit 0
            fi
            echo "::error::FAIL: mobile-affecting PR did not pass mobile-gates (result=$GATES_RES)."
            exit 1
          fi

          if [ "$CHANGED" = "false" ] && [ "$GATES_RES" = "skipped" ]; then
            echo "PASS (not-applicable): no mobile/workflow changes detected; mobile-gates skipped cleanly."
            exit 0
          fi

          echo "::error::FAIL: inconsistent aggregator state (mobile_changed=$CHANGED, mobile-gates=$GATES_RES)."
          exit 1
