name: CI

# Verified locally before this workflow was committed:
#   npm ci → prisma generate → prisma db push → next build → boot standalone → probe.
# Probes assert real behaviour: / = 200, /api/public/status = 200 {"ok":true},
# /api/v1/listings = 401 (auth guard is expected to reject anonymous callers).

on:
  push:
    branches:
      - main
      - fix/tengasell-auction-imp-lr01-r1-rbac-preview
      - feat/tengasell-auction-imp-lr02-commercial-operations
      - cert/tengasell-auction-cert-01-stg01
  pull_request:
    branches:
      - main
      - feat/tengasell-auction-imp01-authority-safety-barrier
      - feat/tengasell-auction-imp-lr01-core-vehicle-events
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  build-and-smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:${{ github.workspace }}/ci.db
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Publish LR01-R1 regression pending status
        if: github.job == 'build-and-smoke'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_HEAD_SHA}" \
            -f state="pending" \
            -f context="tengasell/lr01-r1-regression" \
            -f description="LR01 exact-head regression is running" \
            -f target_url="$RUN_URL" >/dev/null

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Auction authority barrier contract
        run: npm run test:auction-authority

      - name: Transactional auction-core concurrency proof
        run: npm run test:auction-core

      - name: Prisma AUCTION convergence and consumer inventory
        run: npm run test:auction-convergence

      - name: Vehicle / Inspection database authority proof
        run: npm run test:vehicle-intelligence

      - name: Event / Session / Run-List database authority proof
        run: npm run test:auction-events

      - name: Bidder qualification and concurrent capacity proof
        run: npm run test:bidder-qualification

      - name: Auction settlement / transfer / release / transport proof
        run: npm run test:auction-settlement

      - name: Tasks / timeline / exception operations proof
        run: npm run test:auction-operations

      - name: Zimbabwe policy / production gates proof
        run: npm run test:auction-policy

      - name: CERT-01-PREP full commercial journey proof
        run: npm run test:cert01-prep

      - name: TrailBase migration fresh-install and parent-to-tip proof
        run: npm run test:trailbase-migrations

      - name: Event UI responsive and accessibility contract
        run: node tests/event-ui-contract.mjs

      - name: LR02 commercial lifecycle responsive/accessibility contract
        run: npm run test:commercial-ui

      - name: LR01-R1 event RBAC and Auction Hub discoverability contract
        run: node tests/lr01-r1-rbac-navigation-contract.mjs

      - name: Setup Bun for canonical trade engine
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install canonical trade-engine dependencies
        working-directory: mini-services/trade-engine
        run: bun install

      - name: Vehicle / event / operations / policy behavioral RBAC proof
        working-directory: mini-services/trade-engine
        run: bun test vehicle-authority.test.ts event-authority.test.ts operation-authority.test.ts policy-authority.test.ts

      - name: Compile canonical trade engine
        working-directory: mini-services/trade-engine
        run: bun build index.ts --target=node --outfile=/tmp/tengasell-trade-engine.js

      - name: Create CI database
        run: npx prisma db push --skip-generate

      - name: Production build
        run: npm run build

      - name: Install Chromium browser UAT harness
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.56.1
          npx playwright install --with-deps chromium

      - name: Boot standalone server, probe endpoints, and run commercial browser UAT
        run: |
          set -euo pipefail
          PORT=3100 node .next/standalone/server.js &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          READY=0
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3100/api/public/status 2>/dev/null; then
              echo "server ready after ${i}s"
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "::error::standalone server did not become ready"
            exit 1
          fi

          check() {
            local path="$1" expected="$2" code
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3100${path}")"
            echo "GET ${path} -> ${code} (expected ${expected})"
            test "$code" = "$expected"
          }

          check "/" 200
          check "/api/public/status" 200
          check "/api/v1/listings" 401

          body="$(curl -s http://127.0.0.1:3100/api/public/status)"
          echo "$body" | head -c 300; echo
          echo "$body" | grep -q '"ok":true'
          echo "smoke contract satisfied"

          npx playwright test tests/commercial-browser-uat.spec.mjs --reporter=line
          echo "desktop/mobile commercial browser UAT satisfied"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            build.log
            npm-install.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish LR01-R1 exact-head regression status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state=failure
          if [ "$JOB_STATUS" = "success" ]; then state=success; fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${EXPECTED_HEAD_SHA}" \
            -f state="$state" \
            -f context="tengasell/lr01-r1-regression" \
            -f description="LR01 full regression + build/smoke: $JOB_STATUS" \
            -f target_url="$RUN_URL" >/dev/null

  quality:
    name: Lint and typecheck (baseline debt — non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The imported codebase carries pre-existing debt: 18 ESLint errors
    # (react-hooks/set-state-in-effect) and 312 TypeScript diagnostics that the
    # app has always suppressed via `typescript.ignoreBuildErrors`. This job
    # reports both without blocking merges; it is NOT a green light.
    continue-on-error: true
    env:
      DATABASE_URL: file:${{ github.workspace }}/ci.db
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        if: always()
        run: npx tsc --noEmit
