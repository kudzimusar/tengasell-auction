name: Tengasell MOB-01 R3 DEP01 bounded SDK58 resolution
on:
  push:
    branches:
      - fix/tengasell-mobile-mob01-r3-sdk58-patch-alignment
    paths:
      - .github/workflows/tengasell-mobile-mob01-dep01-resolve.yml
permissions:
  contents: write
jobs:
  resolve-sdk58:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dedicated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exact authorized source parent
        run: |
          git merge-base --is-ancestor "70c0397a827ff142cb9477d6cc53d9e50df7d552" HEAD
          git status --porcelain
      - name: Before SDK resolution security snapshot
        working-directory: mobile
        run: |
          npm ci
          npm audit --json > /tmp/dep01-before-audit.json || true
          node -e 'const a=require("/tmp/dep01-before-audit.json"); console.log("BEFORE",JSON.stringify({counts:a.metadata?.vulnerabilities,packages:Object.fromEntries(Object.entries(a.vulnerabilities??{}).map(([k,v])=>[k,{severity:v.severity,via:v.via}]))}))'
      - name: Resolve only the five approved Expo SDK 58 packages
        working-directory: mobile
        run: |
          npx expo install "expo@~58.0.21" "expo-constants@~58.0.14" "expo-linking@~58.0.15" "expo-router@~58.0.28" "expo-system-ui@~58.0.7"
          set +e
          npx expo install --check 2>&1 | tee /tmp/dep01-install-check.txt
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            grep -F 'react-native@0.88.0 - expected version: 0.88.1' /tmp/dep01-install-check.txt || exit "$result"
            echo 'EXTERNAL BASELINE DRIFT: React Native 0.88.1 is now required, outside this five-package authorization.'
          fi
      - name: Assert bounded package.json change
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const before=JSON.parse(execFileSync('git',['show','HEAD:mobile/package.json'],{encoding:'utf8'}));
          const after=JSON.parse(fs.readFileSync('mobile/package.json','utf8'));
          const expected={'expo':'~58.0.21','expo-constants':'~58.0.14','expo-linking':'~58.0.15','expo-router':'~58.0.28','expo-system-ui':'~58.0.7'};
          for(const [name,value] of Object.entries(expected)) {
            if(after.dependencies[name]!==value) throw Error(name+' expected '+value+', found '+after.dependencies[name]);
            before.dependencies[name]=value;
          }
          if(JSON.stringify(before)!==JSON.stringify(after)) throw Error('Unexpected package.json changes outside five approved dependencies');
          console.log('BOUNDARY PASS: only the five approved direct dependency specs changed');
          NODE
          git diff -- mobile/package.json
          git diff --stat -- mobile/package-lock.json
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf 'mobile/package-lock.json\nmobile/package.json')"
      - name: Verify lockfile round trip and inspect security change
        working-directory: mobile
        run: |
          npm ci
          set +e
          npx expo install --check 2>&1 | tee /tmp/dep01-roundtrip-check.txt
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            grep -F 'react-native@0.88.0 - expected version: 0.88.1' /tmp/dep01-roundtrip-check.txt || exit "$result"
            echo 'RN patch compatibility held for Moderator review; other five patches are resolved.'
          fi
          npm audit --json > /tmp/dep01-after-audit.json || true
          node -e 'const a=require("/tmp/dep01-after-audit.json"); console.log("AFTER",JSON.stringify({counts:a.metadata?.vulnerabilities,packages:Object.fromEntries(Object.entries(a.vulnerabilities??{}).map(([k,v])=>[k,{severity:v.severity,via:v.via}]))}))'
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const before=JSON.parse(fs.readFileSync('/tmp/dep01-before-audit.json','utf8'));
          const after=JSON.parse(fs.readFileSync('/tmp/dep01-after-audit.json','utf8'));
          const oldHigh=new Set(Object.entries(before.vulnerabilities??{}).filter(([_,v])=>v.severity==='high').map(([k])=>k));
          const introduced=Object.entries(after.vulnerabilities??{}).filter(([name,v])=>
            v.severity==='critical'||(v.severity==='high'&&!oldHigh.has(name)));
          console.log('ADVISORY BEFORE/AFTER',JSON.stringify({
            beforeCounts:before.metadata?.vulnerabilities,
            afterCounts:after.metadata?.vulnerabilities,
            newHighCritical:introduced.map(([k])=>k),
          }));
          if(introduced.length) throw Error('New untriaged high/critical dependency advisory');
          NODE
          npm ls expo expo-constants expo-linking expo-router expo-system-ui @expo/cli zod --depth=0 || true
      - name: Commit only approved package manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- mobile/package.json mobile/package-lock.json
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = "$(printf 'mobile/package-lock.json\nmobile/package.json')"
          git commit -m "chore(mobile): align five Expo SDK 58 patch dependencies"
          git push origin HEAD:refs/heads/fix/tengasell-mobile-mob01-r3-sdk58-patch-alignment
