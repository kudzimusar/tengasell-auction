name: Deploy preview site to Pages

# Publishes docs/preview/ to GitHub Pages.
# NOTE: Pages is static hosting only — it serves the project preview/documentation site.
# The TengaSell application itself requires a Node runtime (see README "Hosting").

on:
  push:
    branches: [main]
    paths:
      - "docs/preview/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/preview

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
